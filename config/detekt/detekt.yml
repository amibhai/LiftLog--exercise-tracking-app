# Layered on top of detekt's defaults (buildUponDefaultConfig = true) and the default configs
# shipped by the ktlint-wrapper and compose-rules plugins. Only overrides live here.
config:
  validation: true

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

ktlint:
  # Kotlin coding conventions: 120 columns and trailing commas by default for every wrapping rule.
  code_style: 'intellij_idea'

Compose:
  # kotlin.collections.* is declared stable in config/compose/stability.conf instead.
  UnstableCollections:
    active: false
