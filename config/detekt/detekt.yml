# Layered on top of detekt's defaults (buildUponDefaultConfig = true) and the default configs
# shipped by the ktlint-wrapper and compose-rules plugins. Only overrides live here.
config:
  validation: true

complexity:
  CyclomaticComplexMethod:
    # An exhaustive enum -> resource `when` is a lookup table, not complex logic.
    ignoreSimpleWhenEntries: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    # A Room DAO is a list of queries; splitting it by count would not make it simpler.
    ignoreAnnotated: ['Dao']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # Feature navigation files hold one @Serializable destination plus its NavGraphBuilder extensions.
    excludes: ['**/navigation/**']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview', 'PreviewLiftLog']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview', 'PreviewLiftLog']

ktlint:
  # Kotlin coding conventions: 120 columns and trailing commas by default for every wrapping rule.
  code_style: 'intellij_idea'

Compose:
  # kotlin.collections.* is declared stable in config/compose/stability.conf instead.
  UnstableCollections:
    active: false
